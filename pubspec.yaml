name: lexora
description: Premium bilingual English learning app — local-first vocabulary, sentences, and spaced repetition.
publish_to: 'none'
version: 1.0.0+19

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  drift: ^2.35.0
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.1
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  collection: ^1.19.1
  equatable: ^2.1.0
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  fl_chart: ^1.2.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  sqlite3: ^3.6.0
  drift_flutter: ^0.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  file_picker: ^13.1.0
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  record: ^7.1.1
  audioplayers: ^6.8.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/lexora_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/lexora_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/images/
    - assets/vocabulary/
